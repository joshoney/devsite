<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tic-Tac-Toe</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-x: #00bcd4;
            --accent-o: #ff4081;
            --button-color: #bb86fc;
            --button-hover: #9955e8;
            --grid-gap: 15px;
            --cell-size: 100px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 2rem;
        }

        .status {
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 500;
            height: 1.5rem;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--grid-gap);
            margin-bottom: 30px;
            background: var(--surface-color);
            padding: var(--grid-gap);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--surface-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            user-select: none;
            box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0.05);
        }

        .cell:hover:not(.taken) {
            background-color: #2c2c2c;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .cell.x {
            color: var(--accent-x);
            text-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
        }

        .cell.o {
            color: var(--accent-o);
            text-shadow: 0 0 10px rgba(255, 64, 129, 0.4);
        }

        .cell.taken {
            cursor: default;
        }

        .restart-btn {
            background-color: var(--button-color);
            color: #000;
            border: none;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.3);
        }

        .restart-btn:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(187, 134, 252, 0.5);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 400px) {
            :root {
                --cell-size: 80px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>Tic Tac Toe</h1>
    <div class="status" id="status">Player X's Turn</div>
    
    <div class="game-board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button class="restart-btn" id="restartBtn">Restart Game</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusDisplay = document.getElementById('status');
            const cells = document.querySelectorAll('.cell');
            const restartBtn = document.getElementById('restartBtn');

            let gameActive = true;
            let currentPlayer = "X";
            let gameState = ["", "", "", "", "", "", "", "", ""];

            const winningConditions = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            const winningMessage = () => `Player ${currentPlayer} has won!`;
            const drawMessage = () => `Game ended in a draw!`;
            const currentPlayerTurn = () => `Player ${currentPlayer}'s Turn`;

            function handleCellPlayed(clickedCell, clickedCellIndex) {
                gameState[clickedCellIndex] = currentPlayer;
                clickedCell.innerText = currentPlayer;
                clickedCell.classList.add('taken', currentPlayer.toLowerCase());
            }

            function handlePlayerChange() {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                statusDisplay.innerText = currentPlayerTurn();
            }

            function handleResultValidation() {
                let roundWon = false;
                for (let i = 0; i <= 7; i++) {
                    const winCondition = winningConditions[i];
                    let a = gameState[winCondition[0]];
                    let b = gameState[winCondition[1]];
                    let c = gameState[winCondition[2]];
                    if (a === '' || b === '' || c === '') {
                        continue;
                    }
                    if (a === b && b === c) {
                        roundWon = true;
                        break;
                    }
                }

                if (roundWon) {
                    statusDisplay.innerText = winningMessage();
                    statusDisplay.style.color = currentPlayer === "X" ? "var(--accent-x)" : "var(--accent-o)";
                    gameActive = false;
                    return;
                }

                let roundDraw = !gameState.includes("");
                if (roundDraw) {
                    statusDisplay.innerText = drawMessage();
                    statusDisplay.style.color = "var(--text-color)";
                    gameActive = false;
                    return;
                }

                handlePlayerChange();
            }

            function handleCellClick(clickedCellEvent) {
                const clickedCell = clickedCellEvent.target;
                const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

                if (gameState[clickedCellIndex] !== "" || !gameActive) {
                    return;
                }

                handleCellPlayed(clickedCell, clickedCellIndex);
                handleResultValidation();
            }

            function handleRestartGame() {
                gameActive = true;
                currentPlayer = "X";
                gameState = ["", "", "", "", "", "", "", "", ""];
                statusDisplay.innerText = currentPlayerTurn();
                statusDisplay.style.color = "var(--text-color)";
                
                cells.forEach(cell => {
                    cell.innerText = "";
                    cell.classList.remove('taken', 'x', 'o');
                });
            }

            cells.forEach(cell => cell.addEventListener('click', handleCellClick));
            restartBtn.addEventListener('click', handleRestartGame);
        });
    </script>
</body>
</html>
