<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tic-Tac-Toe</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}h1{font-size:2.4rem;font-weight:700;margin-bottom:0.2rem;background:linear-gradient(135deg,#6e8efb,#a777e3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}.subtitle{font-size:0.95rem;color:#6b6b8d;margin-bottom:2rem;font-weight:400}.status{font-size:1.25rem;font-weight:600;margin-bottom:1.5rem;min-height:2rem;transition:color 0.3s ease;color:#c0c0d0}.status.win{color:#4ade80}.status.tie{color:#facc15}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;background:#1a1a2e;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05)}.cell{width:110px;height:110px;background:#16162a;border:2px solid #2a2a4a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;font-weight:700;cursor:pointer;transition:all 0.2s ease;user-select:none;position:relative;overflow:hidden}.cell:hover:not(.taken){background:#1e1e38;border-color:#3a3a5a;transform:scale(1.04);box-shadow:0 0 20px rgba(110,142,251,0.15)}.cell.taken{cursor:default}.cell .mark{animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1)}.cell.x-cell{color:#6e8efb}.cell.o-cell{color:#a777e3}.cell.win-cell{background:#1a2e1a;border-color:#4ade80;box-shadow:0 0 25px rgba(74,222,128,0.2)}@keyframes popIn{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}.restart-btn{margin-top:2rem;padding:12px 36px;font-size:1rem;font-weight:600;font-family:'Inter',sans-serif;color:#fff;background:linear-gradient(135deg,#6e8efb,#a777e3);border:none;border-radius:10px;cursor:pointer;transition:all 0.25s ease;box-shadow:0 4px 15px rgba(110,142,251,0.3)}.restart-btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(110,142,251,0.45)}.restart-btn:active{transform:translateY(0);box-shadow:0 2px 10px rgba(110,142,251,0.3)}.scoreboard{display:flex;gap:2rem;margin-bottom:1.5rem;font-size:0.95rem;font-weight:600}.score-item{padding:8px 20px;background:#1a1a2e;border-radius:10px;border:1px solid #2a2a4a;text-align:center}.score-item .label{font-size:0.75rem;color:#6b6b8d;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}.score-item .value{font-size:1.3rem;color:#e0e0e0}.score-x .value{color:#6e8efb}.score-o .value{color:#a777e3}.score-t .value{color:#6b6b8d}@media(max-width:400px){.cell{width:85px;height:85px;font-size:2.2rem}h1{font-size:1.8rem}}</style></head><body><h1>Tic-Tac-Toe</h1><p class="subtitle">X goes first</p><div class="scoreboard"><div class="score-item score-x"><div class="label">X Wins</div><div class="value" id="scoreX">0</div></div><div class="score-item score-t"><div class="label">Ties</div><div class="value" id="scoreT">0</div></div><div class="score-item score-o"><div class="label">O Wins</div><div class="value" id="scoreO">0</div></div></div><div class="status" id="status">Player X's turn</div><div class="board" id="board"></div><button class="restart-btn" id="restartBtn">Restart Game</button><script>const board=document.getElementById('board');const statusEl=document.getElementById('status');const restartBtn=document.getElementById('restartBtn');const scoreXEl=document.getElementById('scoreX');const scoreOEl=document.getElementById('scoreO');const scoreTEl=document.getElementById('scoreT');let cells=Array(9).fill('');let currentPlayer='X';let gameActive=true;let scores={X:0,O:0,T:0};const winConditions=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function createBoard(){board.innerHTML='';cells.fill('');cells.forEach((_,i)=>{const cell=document.createElement('div');cell.classList.add('cell');cell.dataset.index=i;cell.addEventListener('click',handleCellClick);board.appendChild(cell);});}function handleCellClick(e){const index=e.target.dataset.index;if(cells[index]||!gameActive)return;cells[index]=currentPlayer;const cell=e.target;cell.classList.add('taken',currentPlayer.toLowerCase()+'-cell');cell.innerHTML=`<span class="mark">${currentPlayer}</span>`;const winResult=checkWin();if(winResult!==null){gameActive=false;if(winResult==='tie'){statusEl.textContent="It's a tie!";statusEl.classList.add('tie');scores.T++;scoreTEl.textContent=scores.T;}else{statusEl.textContent=`Player ${currentPlayer} wins! 🎉`;statusEl.classList.add('win');scores[currentPlayer]++;if(currentPlayer==='X')scoreXEl.textContent=scores.X;else scoreOEl.textContent=scores.O;highlightWin(winResult);}return;}currentPlayer=currentPlayer==='X'?'O':'X';statusEl.textContent=`Player ${currentPlayer}'s turn`;statusEl.classList.remove('win','tie');}function checkWin(){for(const condition of winConditions){const[a,b,c]=condition;if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[c])return condition;}if(!cells.includes(''))return'tie';return null;}function highlightWin(winCells){const cellEls=board.querySelectorAll('.cell');winCells.forEach(i=>{cellEls[i].classList.add('win-cell');});}restartBtn.addEventListener('click',()=>{gameActive=true;currentPlayer='X';statusEl.textContent="Player X's turn";statusEl.classList.remove('win','tie');createBoard();});createBoard();</script></body></html>
