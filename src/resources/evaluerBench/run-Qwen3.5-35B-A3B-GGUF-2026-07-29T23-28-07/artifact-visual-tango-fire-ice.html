<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tango Logic Puzzle</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #e94560;
            --fire-color: #ff6b6b;
            --ice-color: #4ecdc4;
            --border-color: #2a2a40;
            --constraint-bg: #2a2a40;
            --constraint-text: #ffd700;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-color);
        }

        .game-container {
            background-color: var(--panel-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 60px);
            grid-template-rows: repeat(6, 60px);
            gap: 4px;
            background-color: var(--border-color);
            border: 4px solid var(--border-color);
            border-radius: 4px;
            position: relative;
        }

        .cell {
            width: 60px;
            height: 60px;
            background-color: var(--panel-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
        }

        .cell:hover {
            background-color: var(--accent-color);
        }

        .cell.fire {
            color: var(--fire-color);
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .cell.ice {
            color: var(--ice-color);
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
        }

        /* Constraint Markers */
        .constraint {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: var(--constraint-bg);
            color: var(--constraint-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border-radius: 50%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to cells */
        }

        .constraint.right {
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .constraint.bottom {
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Error Highlighting */
        .cell.error {
            background-color: rgba(233, 69, 96, 0.2);
            animation: shake 0.3s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            50% { transform: translateX(2px); }
            75% { transform: translateX(-2px); }
            100% { transform: translateX(0); }
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-new {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-check {
            background-color: var(--text-color);
            color: white;
        }

        .status {
            margin-top: 15px;
            height: 24px;
            font-size: 14px;
            color: #ccc;
        }

        .instructions {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            max-width: 400px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(6, 45px);
                grid-template-rows: repeat(6, 45px);
            }
            .cell {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
            .constraint {
                width: 14px;
                height: 14px;
                font-size: 10px;
            }
            .constraint.right { right: -10px; }
            .constraint.bottom { bottom: -10px; }
        }
    </style>
</head>
<body>

    <h1>TANGO</h1>
    
    <div class="game-container">
        <div id="grid" class="grid">
            <!-- Grid generated by JS -->
        </div>

        <div class="controls">
            <button class="btn-new" onclick="initGame()">New Puzzle</button>
            <button class="btn-check" onclick="checkSolution()">Check Solution</button>
        </div>
        <div id="status" class="status"></div>
    </div>

    <div class="instructions">
        <strong>Rules:</strong><br>
        1. Each row and column must have exactly 3 Fire (🔥) and 3 Ice (🧊).<br>
        2. No three identical symbols in a row (horizontally or vertically).<br>
        3. <strong>=</strong> means neighbors are the same.<br>
        4. <strong>×</strong> means neighbors are different.<br>
        <strong>Click a cell to cycle:</strong> Empty → 🔥 → 🧊 → Empty.
    </div>

    <script>
        // --- Game Constants & State ---
        const GRID_SIZE = 6;
        const SYMBOLS = {
            EMPTY: 0,
            FIRE: 1,
            ICE: 2
        };
        
        let solutionBoard = [];
        let playerBoard = [];
        let constraints = {
            h: [], // Horizontal constraints
            v: []  // Vertical constraints
        };

        // --- Core Logic: Generator ---

        function isValid(board, row, col, val) {
            // Check Row Balance
            let rowCount = 0;
            let rowStreak = 0;
            for (let c = 0; c < GRID_SIZE; c++) {
                if (board[row][c] === val) rowCount++;
                if (board[row][c] === val) rowStreak++;
                else rowStreak = 0;
                if (rowStreak >= 3) return false;
            }
            if (rowCount >= 3) return false;

            // Check Col Balance
            let colCount = 0;
            let colStreak = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                if (board[r][col] === val) colCount++;
                if (board[r][col] === val) colStreak++;
                else colStreak = 0;
                if (colStreak >= 3) return false;
            }
            if (colCount >= 3) return false;

            return true;
        }

        function solve(board, row, col) {
            if (row === GRID_SIZE) return true; // Solved
            if (col === GRID_SIZE) return solve(board, row + 1, 0); // Next row

            // Try Fire
            if (isValid(board, row, col, SYMBOLS.FIRE)) {
                board[row][col] = SYMBOLS.FIRE;
                if (solve(board, row, col + 1)) return true;
                board[row][col] = SYMBOLS.EMPTY;
            }

            // Try Ice
            if (isValid(board, row, col, SYMBOLS.ICE)) {
                board[row][col] = SYMBOLS.ICE;
                if (solve(board, row, col + 1)) return true;
                board[row][col] = SYMBOLS.EMPTY;
            }

            return false;
        }

        function generateSolution() {
            let board = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(SYMBOLS.EMPTY));
            // Randomize starting bias to ensure variety
            if (Math.random() > 0.5) board[0][0] = SYMBOLS.FIRE;
            else board[0][0] = SYMBOLS.ICE;
            
            solve(board, 0, 0);
            return board;
        }

        function generateConstraints(board) {
            let hConstraints = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE - 1).fill(0));
            let vConstraints = Array(GRID_SIZE - 1).fill().map(() => Array(GRID_SIZE).fill(0));

            // 1. Determine all valid constraints
            let validConstraints = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE - 1; c++) {
                    let type = (board[r][c] === board[r][c+1]) ? '=' : 'x';
                    validConstraints.push({ r, c, type, axis: 'h' });
                }
            }

            for (let r = 0; r < GRID_SIZE - 1; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let type = (board[r][c] === board[r+1][c]) ? '=' : 'x';
                    validConstraints.push({ r, c, type, axis: 'v' });
                }
            }

            // 2. Randomly select 6 to 8 constraints
            let numConstraints = Math.floor(Math.random() * 3) + 6; // 6, 7, or 8
            let selected = [];
            
            // Shuffle and pick
            validConstraints.sort(() => Math.random() - 0.5);
            for (let i = 0; i < Math.min(numConstraints, validConstraints.length); i++) {
                selected.push(validConstraints[i]);
            }

            // 3. Populate constraint arrays
            selected.forEach(c => {
                if (c.axis === 'h') hConstraints[c.r][c.c] = c.type;
                else vConstraints[c.r][c.c] = c.type;
            });

            return { h: hConstraints, v: vConstraints };
        }

        function createPuzzle(solution, constraintsData) {
            // Deep copy solution
            let puzzle = solution.map(row => [...row]);
            
            // Clear 70% of cells
            let totalCells = GRID_SIZE * GRID_SIZE;
            let cellsToClear = Math.floor(totalCells * 0.7);
            let cleared = 0;

            while (cleared < cellsToClear) {
                let r = Math.floor(Math.random() * GRID_SIZE);
                let c = Math.floor(Math.random() * GRID_SIZE);
                if (puzzle[r][c] !== SYMBOLS.EMPTY) {
                    puzzle[r][c] = SYMBOLS.EMPTY;
                    cleared++;
                }
            }
            return puzzle;
        }

        // --- Rendering & Interaction ---

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    
                    // Render Symbol
                    const val = playerBoard[r][c];
                    if (val === SYMBOLS.FIRE) {
                        cell.textContent = '🔥';
                        cell.classList.add('fire');
                    } else if (val === SYMBOLS.ICE) {
                        cell.textContent = '🧊';
                        cell.classList.add('ice');
                    }

                    // Render Constraints (Right)
                    if (c < GRID_SIZE - 1 && constraints.h[r][c] !== 0) {
                        const cons = document.createElement('span');
                        cons.className = 'constraint right';
                        cons.textContent = constraints.h[r][c];
                        cell.appendChild(cons);
                    }

                    // Render Constraints (Bottom)
                    if (r < GRID_SIZE - 1 && constraints.v[r][c] !== 0) {
                        const cons = document.createElement('span');
                        cons.className = 'constraint bottom';
                        cons.textContent = constraints.v[r][c];
                        cell.appendChild(cons);
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    gridEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            const current = playerBoard[r][c];
            let next = current + 1;
            if (next > 2) next = 0; // Cycle: 0 -> 1 -> 2 -> 0
            playerBoard[r][c] = next;
            renderGrid();
            // Remove error styling on interaction
            document.querySelectorAll('.cell').forEach(el => el.classList.remove('error'));
            document.getElementById('status').textContent = "";
        }

        function checkSolution() {
            let errors = [];
            let errorCells = new Set(); // Store "r,c" strings

            // 1. Check Balance & 3-in-a-row (Rows)
            for (let r = 0; r < GRID_SIZE; r++) {
                let fireCount = 0;
                let iceCount = 0;
                let streak = 0;
                let lastVal = -1;

                for (let c = 0; c < GRID_SIZE; c++) {
                    const val = playerBoard[r][c];
                    if (val === SYMBOLS.FIRE) fireCount++;
                    if (val === SYMBOLS.ICE) iceCount++;

                    if (val !== lastVal) {
                        streak = 1;
                    } else {
                        streak++;
                        if (streak === 3) errorCells.add(`${r},${c}`);
                    }
                    lastVal = val;
                }
                if (fireCount !== 3) {
                    for(let c=0; c<GRID_SIZE; c++) if(playerBoard[r][c] === SYMBOLS.FIRE) errorCells.add(`${r},${c}`);
                }
                if (iceCount !== 3) {
                    for(let c=0; c<GRID_SIZE; c++) if(playerBoard[r][c] === SYMBOLS.ICE) errorCells.add(`${r},${c}`);
                }
            }

            // 2. Check Balance & 3-in-a-row (Cols)
            for (let c = 0; c < GRID_SIZE; c++) {
                let fireCount = 0;
                let iceCount = 0;
                let streak = 0;
                let lastVal = -1;

                for (let r = 0; r < GRID_SIZE; r++) {
                    const val = playerBoard[r][c];
                    if (val === SYMBOLS.FIRE) fireCount++;
                    if (val === SYMBOLS.ICE) iceCount++;

                    if (val !== lastVal) {
                        streak = 1;
                    } else {
                        streak++;
                        if (streak === 3) errorCells.add(`${r},${c}`);
                    }
                    lastVal = val;
                }
                if (fireCount !== 3) {
                    for(let r=0; r<GRID_SIZE; r++) if(playerBoard[r][c] === SYMBOLS.FIRE) errorCells.add(`${r},${c}`);
                }
                if (iceCount !== 3) {
                    for(let r=0; r<GRID_SIZE; r++) if(playerBoard[r][c] === SYMBOLS.ICE) errorCells.add(`${r},${c}`);
                }
            }

            // 3. Check Constraints
            // Horizontal
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE - 1; c++) {
                    let cons = constraints.h[r][c];
                    if (cons !== 0) {
                        let val1 = playerBoard[r][c];
                        let val2 = playerBoard[r][c+1];
                        if (val1 === SYMBOLS.EMPTY || val2 === SYMBOLS.EMPTY) continue; // Ignore empty cells

                        if (cons === '=' && val1 !== val2) {
                            errorCells.add(`${r},${c}`);
                            errorCells.add(`${r},${c+1}`);
                        } else if (cons === 'x' && val1 === val2) {
                            errorCells.add(`${r},${c}`);
                            errorCells.add(`${r},${c+1}`);
                        }
                    }
                }
            }
            // Vertical
            for (let r = 0; r < GRID_SIZE - 1; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let cons = constraints.v[r][c];
                    if (cons !== 0) {
                        let val1 = playerBoard[r][c];
                        let val2 = playerBoard[r+1][c];
                        if (val1 === SYMBOLS.EMPTY || val2 === SYMBOLS.EMPTY) continue;

                        if (cons === '=' && val1 !== val2) {
                            errorCells.add(`${r},${c}`);
                            errorCells.add(`${r+1},${c}`);
                        } else if (cons === 'x' && val1 === val2) {
                            errorCells.add(`${r},${c}`);
                            errorCells.add(`${r+1},${c}`);
                        }
                    }
                }
            }

            // Apply Visuals
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = cell.dataset.r;
                const c = cell.dataset.c;
                if (errorCells.has(`${r},${c}`)) {
                    cell.classList.add('error');
                }
            });

            // Status Message
            const statusEl = document.getElementById('status');
            if (errorCells.size === 0) {
                statusEl.textContent = "Perfect! Solution is valid.";
                statusEl.style.color = "#4ecdc4";
            } else {
                statusEl.textContent = `${errorCells.size} cell(s) contain errors.`;
                statusEl.style.color = "#e94560";
            }
        }

        function initGame() {
            solutionBoard = generateSolution();
            constraints = generateConstraints(solutionBoard);
            playerBoard = createPuzzle(solutionBoard, constraints);
            renderGrid();
            document.getElementById('status').textContent = "";
            document.querySelectorAll('.cell').forEach(el => el.classList.remove('error'));
        }

        // Start
        initGame();

    </script>
</body>
</html>
