<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tic-Tac-Toe</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #4facfe;
            --secondary-color: #ff6b6b;
            --text-color: #e0e0e0;
            --grid-gap: 10px;
            --cell-size: 100px;
            --border-radius: 12px;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .status {
            margin-bottom: 20px;
            font-size: 1.2rem;
            height: 1.5em;
            color: #aaa;
            transition: color var(--transition-speed);
        }

        .status span {
            font-weight: bold;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, var(--cell-size));
            grid-template-rows: repeat(3, var(--cell-size));
            gap: var(--grid-gap);
            background-color: var(--surface-color);
            padding: var(--grid-gap);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cell {
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color var(--transition-speed), transform var(--transition-speed);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .cell:hover {
            background-color: #252525;
            transform: scale(0.98);
        }

        .cell.x {
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        }

        .cell.o {
            color: var(--secondary-color);
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .cell.winning {
            background-color: rgba(255, 255, 255, 0.1);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.1); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .restart-btn {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 1rem;
            background: linear-gradient(45deg, var(--primary-color), #00f2fe);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        .restart-btn:active {
            transform: translateY(1px);
        }

        @media (max-width: 400px) {
            :root {
                --cell-size: 80px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>Tic Tac Toe</h1>
    <div class="status" id="status">Player <span id="player-display">X</span>'s Turn</div>

    <div class="game-board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button class="restart-btn" id="restart-btn">Restart Game</button>

    <script>
        const statusDisplay = document.getElementById('status');
        const playerDisplay = document.getElementById('player-display');
        const cells = document.querySelectorAll('.cell');
        const restartBtn = document.getElementById('restart-btn');

        let gameActive = true;
        let currentPlayer = "X";
        let gameState = ["", "", "", "", "", "", "", "", ""];

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        const winningMessage = () => `Player <span style="color: ${currentPlayer === 'X' ? 'var(--primary-color)' : 'var(--secondary-color)'}">${currentPlayer}</span> Wins!`;
        const drawMessage = () => `Game ended in a Draw!`;
        const currentPlayerTurn = () => `Player <span style="color: ${currentPlayer === 'X' ? 'var(--primary-color)' : 'var(--secondary-color)'}">${currentPlayer}</span>'s Turn`;

        function handleCellPlayed(clickedCell, clickedCellIndex) {
            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.innerText = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase());
        }

        function handlePlayerChange() {
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            playerDisplay.innerText = currentPlayer;
            statusDisplay.innerHTML = currentPlayerTurn();
        }

        function handleResultValidation() {
            let roundWon = false;
            let winningLine = [];

            for (let i = 0; i <= 7; i++) {
                const winCondition = winningConditions[i];
                let a = gameState[winCondition[0]];
                let b = gameState[winCondition[1]];
                let c = gameState[winCondition[2]];

                if (a === '' || b === '' || c === '') {
                    continue;
                }
                if (a === b && b === c) {
                    roundWon = true;
                    winningLine = winCondition;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.innerHTML = winningMessage();
                gameActive = false;
                highlightWinningCells(winningLine);
                return;
            }

            let roundDraw = !gameState.includes("");
            if (roundDraw) {
                statusDisplay.innerText = drawMessage();
                gameActive = false;
                return;
            }

            handlePlayerChange();
        }

        function highlightWinningCells(indices) {
            indices.forEach(index => {
                cells[index].classList.add('winning');
            });
        }

        function handleCellClick(clickedCellEvent) {
            const clickedCell = clickedCellEvent.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (gameState[clickedCellIndex] !== "" || !gameActive) {
                return;
            }

            handleCellPlayed(clickedCell, clickedCellIndex);
            handleResultValidation();
        }

        function handleRestartGame() {
            gameActive = true;
            currentPlayer = "X";
            gameState = ["", "", "", "", "", "", "", "", ""];
            statusDisplay.innerHTML = currentPlayerTurn();
            playerDisplay.innerText = currentPlayer;
            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('x', 'o', 'winning');
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', handleRestartGame);
    </script>
</body>
</html>
