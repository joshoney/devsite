<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tango Puzzle</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #fafafa;
    color: #333;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(6, 80px);
    gap: 2px;
    height: 100vh;
    margin: 20px auto;
  }
  .cell {
    width: 80px;
    height: 80px;
    background: #f0f0f0;
    border: 1px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    cursor: pointer;
  }
  .cell:hover {
    background: #e0e0e0;
  }
  .constraint {
    position: absolute;
    width: 1.2em;
    height: 1.2em;
    pointer-events: none;
    text-anchor: middle;
  }
  #checkBtn {
    margin-top: 1rem;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
  }
  #validationErrors {
    margin-top: 1rem;
    white-space: pre;
    background: #fff4dd;
    padding: 0.5rem;
    border-left: 4px solid #d4a017;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="constraints"></div>
<button id="checkBtn">Check Solution</button>

<script>
const ROWS = 6;
const COLS = 6;
const SYM1 = '🔥';
const SYM2 = '🧊';
const EMPTY = -1;
let solution = null;

function solve() {
  const board = Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
  const rowCounts = Array.from({ length: ROWS }, () => [0, 0]); // 1 = 🔥, 2 = 🧊
  const colCounts = Array.from({ length: ROWS }, () => [0, 0]);

  function hasThreeInRow(r, c, sym) {
    if (c < 2) return false;
    let cnt = 0;
    for (let i = c - 2; i <= c; i++) {
      const v = board[r][i];
      if (v === sym) cnt++;
      else cnt = 0;
      if (cnt >= 3) return true;
    }
    return false;
  }

  function backtrack(r, c) {
    if (c === COLS) {
      solution = [row.slice() for row in board];
      return true;
    }
    const nextCol = c + 1;
    if (nextCol >= COLS && backtrack(r, nextCol)) return true;
    if (board[r][c] !== EMPTY) {
      if (nextCol >= COLS) return backtrack(r, nextCol);
    }
    // try 🔥
    if (rowCounts[r][1] < 3 && colCounts[c][1] < 3 && !hasThreeInRow(r, c, SYM1)) {
      board[r][c] = 1;
      rowCounts[r][1]++;
      colCounts[c][1]++;
      if (backtrack(r, nextCol)) return true;
      board[r][c] = EMPTY;
      rowCounts[r][1]--;
      colCounts[c][1]--;
    }
    // try 🧊
    if (rowCounts[r][2] < 3 && colCounts[c][2] < 3 && !hasThreeInRow(r, c, SYM2)) {
      board[r][c] = 2;
      rowCounts[r][2]++;
      colCounts[c][2]++;
      if (backtrack(r, nextCol)) return true;
      board[r][c] = EMPTY;
      rowCounts[r][2]--;
      colCounts[c][2]--;
    }
    return false;
  }

  if (backtrack(0, 0)) return true;
  return false;
}

function generateMarkers() {
  const pairs = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c + 1 < COLS) pairs.push([r, c, 'R']);
      if (r + 1 < ROWS) pairs.push([r, c, 'D']);
    }
  }
  const chosen = new Set();
  const min = Math.ceil(0.3 * ROWS * COLS);
  const max = Math.floor(0.8 * ROWS * COLS);
  let count = Math.random() * (max - min + 1) + min;
  while (chosen.size < count) {
    const idx = Math.floor(Math.random() * pairs.length);
    chosen.add(pairs[idx]);
  }
  return Array.from(chosen);
}

function clearCells(player) {
  const total = ROWS * COLS;
  const toClear = Math.ceil(0.3 * total);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (player[r][c] !== EMPTY) continue;
      if (Math.random() < 0.7) {
        player[r][c] = EMPTY;
      }
    }
  }
}

function renderBoard(player, solution) {
  const container = document.getElementById('grid');
  container.innerHTML = '';
  const cellWidth = 80;
  const rowHeight = 100;
  const containerSize = document.documentElement.getBoundingClientRect();
  const grid = document.createElement('div');
  grid.style.width = `${containerSize.width}px`;
  grid.style.height = `${containerSize.height}px`;
  grid.style.position = 'relative';
  container.appendChild(grid);
  const constraints = document.getElementById('constraints');
  constraints.innerHTML = '';
  for (const [r, c, dir] of markerPairs) {
    const left = dir === 'R' ? `${r},${c + 0.5}` : `${r + 0.5},${c}`;
    const top = dir === 'D' ? `${r + 0.5},${c}` : `${r},${c + 0.5}`;
    const el = document.createElement('span');
    el.className = 'constraint';
    el.textContent = dir;
    el.style.left = left;
    el.style.top = top;
    constraints.appendChild(el);
  }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (player[r][c] === SYM1) cell.textContent = SYM1;
      else if (player[r][c] === SYM2) cell.textContent = SYM2;
      constraints.appendChild(cell);
      if (player[r][c] !== EMPTY) {
        cell.style.background = player[r][c] === SYM1 ? SYM1 : SYM2;
      }
    }
  }
}

function validateBoard() {
  const errors = [];
  // row balance
  for (let r = 0; r < ROWS; r++) {
    let cnt1 = 0, cnt2 = 0;
    for (let c = 0; c < COLS; c++) {
      const v = solution[r][c];
      if (v === 1) cnt1++;
      else if (v === 2) cnt2++;
    }
    if (cnt1 !== 3 || cnt2 !== 3) errors.push(`Row ${r+1} does not contain exactly three 🔥 and three 🧊`);
  }
  // column balance
  for (let c = 0; c < COLS; c++) {
    let cnt1 = 0, cnt2 = 0;
    for (let r = 0; r < ROWS; r++) {
      const v = solution[r][c];
      if (v === 1) cnt1++;
      else if (v === 2) cnt2++;
    }
    if (cnt1 !== 3 || cnt2 !== 3) errors.push(`Column ${c+1} does not contain exactly three 🔥 and three 🧊`);
  }
  // no three in a row
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (solution[r][c] === 1) continue;
      if (solution[r][c+1] === 1 && solution[r][c+2] === 1) errors.push(`Row ${r+1}, cols ${c+1}-${c+3} have three consecutive 🔥`);
      if (solution[r][c] === 2 && solution[r][c+1] === 2 && solution[r][c+2] === 2) errors.push(`Row ${r+1}, cols ${c+1}-${c+3} have three consecutive 🧊`);
      if (solution[r+1][c] === 1 && solution[r+1][c+1] === 1 && solution[r+1][c+2] === 1) errors.push(`Column ${c+1}, rows ${r+1}-${r+3} have three consecutive 🔥`);
      if (solution[r+1][c] === 2 && solution[r+1][c+1] === 2 && solution[r+1][c+2] === 2) errors.push(`Column ${c+1}, rows ${r+1}-${r+3} have three consecutive 🧊`);
    }
  }
  // constraint markers
  const dirs = { 'R': '=', 'D': '×' };
  const placed = new Set(markerPairs);
  for (const p of markerPairs) {
    const [r, c, dir] = p;
    const left = dir === 'R' ? `${r},${c + 0.5}` : `${r + 0.5},${c}`;
    const top = dir === 'D' ? `${r + 0.5},${c}` : `${r,${c + 0.5}`;
    const el = document.createElement('span');
    el.className = 'constraint';
    el.textContent = dir;
    el.style.left = left;
    el.style.top = top;
    document.getElementById('constraints').appendChild(el);
  }
  if (errors.length) {
    document.getElementById('checkBtn').style.color = 'red';
    const errDiv = document.createElement('div');
    errDiv.id = 'validationErrors';
    errDiv.textContent = `<strong>Errors:</strong> ${errors.join('<br>') || 'No errors'}`;
    document.body.appendChild(errDiv);
  } else {
    document.getElementById('checkBtn').style.color = 'black';
  }
}

let markerPairs = [];

function init() {
  // generate solution
  solution = null;
  if (!solve()) {
    console.warn('Could not generate solution');
    return;
  }
  // generate markers
  markerPairs = generateMarkers();
  // clear 70% of cells
  clearCells(solution);
  const total = ROWS * COLS;
  const toClear = Math.ceil(0.3 * total);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (Math.random() < 0.7) {
        solution[r][c] = EMPTY;
      }
    }
  }
  renderBoard(solution, null);
}

setTimeout(init, 2000);
</script>
</body>
</html>
