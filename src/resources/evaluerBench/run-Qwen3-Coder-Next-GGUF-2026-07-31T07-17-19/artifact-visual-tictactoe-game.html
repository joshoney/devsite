<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        :root {
            --bg-color: #121212;
            --board-bg: #1e1e1e;
            --cell-bg: #2a2a2a;
            --cell-hover: #3a3a3a;
            --text-color: #e0e0e0;
            --accent-x: #ff5252;
            --accent-o: #448aff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .game-container {
            background-color: var(--board-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-bar {
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            min-height: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .player-indicator {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .player-indicator.active-x {
            background-color: var(--accent-x);
            color: white;
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.4);
        }

        .player-indicator.active-o {
            background-color: var(--accent-o);
            color: white;
            box-shadow: 0 0 10px rgba(68, 138, 255, 0.4);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            margin-bottom: 2rem;
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .cell:hover {
            background-color: var(--cell-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .cell.x {
            color: var(--accent-x);
        }

        .cell.o {
            color: var(--accent-o);
        }

        .cell.winning {
            background-color: #2e7d32;
            color: white;
            animation: pulse 1s infinite;
        }

        .restart-btn {
            background-color: #ffffff;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .restart-btn:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 400px) {
            .board {
                grid-template-columns: repeat(3, 80px);
                grid-template-rows: repeat(3, 80px);
            }
            
            .cell {
                font-size: 2.5rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    
    <div class="game-container">
        <div class="status-bar">
            <span id="statusText">Player X's Turn</span>
        </div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <div class="status-bar">
            <span id="playerIndicator" class="player-indicator active-x">Player X</span>
        </div>
        
        <button class="restart-btn" id="restartBtn">Restart Game</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('.cell');
            const restartBtn = document.getElementById('restartBtn');
            const statusText = document.getElementById('statusText');
            const playerIndicator = document.getElementById('playerIndicator');
            
            let currentPlayer = 'X';
            let gameActive = true;
            let boardState = ['', '', '', '', '', '', '', '', ''];
            
            const winningConditions = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];
            
            function handleCellClick(e) {
                const clickedCell = e.target;
                const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));
                
                if (boardState[clickedCellIndex] !== '' || !gameActive) {
                    return;
                }
                
                handleCellPlayed(clickedCell, clickedCellIndex);
                handleResultValidation();
            }
            
            function handleCellPlayed(clickedCell, clickedCellIndex) {
                boardState[clickedCellIndex] = currentPlayer;
                clickedCell.textContent = currentPlayer;
                clickedCell.classList.add(currentPlayer.toLowerCase());
            }
            
            function handleResultValidation() {
                let roundWon = false;
                let winningCells = [];
                
                for (let i = 0; i <= 7; i++) {
                    const winCondition = winningConditions[i];
                    const a = boardState[winCondition[0]];
                    const b = boardState[winCondition[1]];
                    const c = boardState[winCondition[2]];
                    
                    if (a === '' || b === '' || c === '') {
                        continue;
                    }
                    
                    if (a === b && b === c) {
                        roundWon = true;
                        winningCells = winCondition;
                        break;
                    }
                }
                
                if (roundWon) {
                    statusText.textContent = `Player ${currentPlayer} Wins!`;
                    gameActive = false;
                    highlightWinningCells(winningCells);
                    updatePlayerIndicator();
                    return;
                }
                
                const roundDraw = !boardState.includes('');
                if (roundDraw) {
                    statusText.textContent = "It's a Tie!";
                    gameActive = false;
                    statusText.style.color = '#e0e0e0';
                    return;
                }
                
                handlePlayerChange();
            }
            
            function handlePlayerChange() {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                statusText.textContent = `Player ${currentPlayer}'s Turn`;
                updatePlayerIndicator();
            }
            
            function updatePlayerIndicator() {
                if (gameActive) {
                    if (currentPlayer === 'X') {
                        playerIndicator.textContent = 'Player X';
                        playerIndicator.className = 'player-indicator active-x';
                    } else {
                        playerIndicator.textContent = 'Player O';
                        playerIndicator.className = 'player-indicator active-o';
                    }
                } else {
                    const winner = statusText.textContent.includes('Wins') ? statusText.textContent.split(' ')[1] : 'Tie';
                    if (winner === 'Tie') {
                        playerIndicator.textContent = 'Tie Game';
                        playerIndicator.style.backgroundColor = '#757575';
                        playerIndicator.style.boxShadow = 'none';
                    } else {
                        playerIndicator.textContent = `Winner: ${winner}`;
                        playerIndicator.style.backgroundColor = winner === 'X' ? 'var(--accent-x)' : 'var(--accent-o)';
                        playerIndicator.style.boxShadow = `0 0 10px rgba(${winner === 'X' ? '255, 82, 82' : '68, 138, 255'}, 0.4)`;
                    }
                }
            }
            
            function highlightWinningCells(indices) {
                indices.forEach(index => {
                    cells[index].classList.add('winning');
                });
            }
            
            function restartGame() {
                currentPlayer = 'X';
                gameActive = true;
                boardState = ['', '', '', '', '', '', '', '', ''];
                statusText.textContent = "Player X's Turn";
                statusText.style.color = '#e0e0e0';
                
                cells.forEach(cell => {
                    cell.textContent = '';
                    cell.className = 'cell';
                });
                
                playerIndicator.textContent = 'Player X';
                playerIndicator.className = 'player-indicator active-x';
            }
            
            cells.forEach(cell => cell.addEventListener('click', handleCellClick));
            restartBtn.addEventListener('click', restartGame);
        });
    </script>
</body>
