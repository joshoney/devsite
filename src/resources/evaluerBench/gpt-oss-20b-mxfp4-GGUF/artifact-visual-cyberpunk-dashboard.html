<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyberpunk System Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505;
  --accent-cyan:#00ffff;
  --accent-magenta:#ff00ff;
  --accent-green:#39ff14;
  --text:#cfcfcf;
  --scanline:#00ff00;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Orbitron',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}
.sidebar{
  position:fixed;
  left:0;top:0;
  width:250px;height:100vh;
  background:#111;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
.profile{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent-cyan),var(--accent-magenta));
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;color:#000;
}
.profile span{font-weight:bold;}
.nav{
  width:100%;
}
.nav button{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  background:transparent;
  border:1px solid var(--accent-green);
  color:var(--accent-green);
  font-size:1rem;
  cursor:pointer;
  transition:.3s;
}
.nav button:hover{background:var(--accent-green);color:#000;}
.main{
  margin-left:250px;
  padding:20px;
  height:100vh;
  overflow-y:auto;
}
.header{
  font-size:2.5rem;
  font-weight:700;
  margin-bottom:20px;
  position:relative;
  color:var(--accent-cyan);
  text-shadow:0 0 5px var(--accent-cyan);
  animation:glitch 3s infinite;
}
@keyframes glitch{
  0%{text-shadow:0 0 5px var(--accent-cyan);}
  20%{text-shadow:-2px 0 5px var(--accent-magenta);}
  40%{text-shadow:2px 0 5px var(--accent-green);}
  60%{text-shadow:-1px 0 5px var(--accent-cyan);}
  80%{text-shadow:1px 0 5px var(--accent-magenta);}
  100%{text-shadow:0 0 5px var(--accent-cyan);}
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}
.panel{
  background:rgba(0,0,0,0.6);
  border:1px solid var(--accent-cyan);
  padding:20px;
  position:relative;
  clip-path:ellipse(50% 20% at 50% 0);
  overflow:hidden;
}
.panel h3{
  color:var(--accent-cyan);
  margin-bottom:10px;
}
.progress{
  width:100%;height:20px;
  background:rgba(255,255,255,0.1);
  border-radius:10px;
  overflow:hidden;
  position:relative;
}
.progress-bar{
  height:100%;
  background:var(--accent-green);
  width:0%;
  transition:width 0.5s ease;
}
.circle{
  width:120px;height:120px;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  position:relative;
  margin:0 auto;
}
.circle::before{
  content:"";
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:100px;height:100px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%,var(--accent-cyan),transparent);
  clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%);
}
.terminal{
  background:#000;
  color:var(--accent-cyan);
  font-family:monospace;
  font-size:0.9rem;
  height:200px;
  overflow-y:auto;
  padding:10px;
  border:1px solid var(--accent-magenta);
  position:relative;
}
.terminal::before{
  content:"$ ";
  position:absolute;
  left:0;top:0;
  color:var(--accent-magenta);
}
.scanline{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background: repeating-linear-gradient(0deg,transparent,transparent 1px,var(--scanline) 1px,var(--scanline) 2px);
  opacity:0.1;
  pointer-events:none;
  z-index:9999;
}
</style>
</head>
<body>
<div class="sidebar">
  <div class="profile"><span>U</span></div>
  <div class="nav">
    <button>Dashboard</button>
    <button>Analytics</button>
    <button>Logs</button>
    <button>Settings</button>
  </div>
</div>
<div class="main">
  <div class="header">SYSTEM MONITOR</div>
  <div class="grid">
    <div class="panel" id="panel-1">
      <h3>CPU &amp; RAM</h3>
      <div class="progress"><div class="progress-bar" id="cpu-bar"></div></div>
      <div class="circle" id="cpu-circle"></div>
    </div>
    <div class="panel" id="panel-2">
      <h3>Terminal Logs</h3>
      <div class="terminal" id="terminal"></div>
    </div>
    <div class="panel" id="panel-3">
      <h3>Network Traffic</h3>
      <p>Placeholder content for future data.</p>
    </div>
  </div>
</div>
<div class="scanline"></div>
<script>
const cpuBar=document.getElementById('cpu-bar');
const cpuCircle=document.getElementById('cpu-circle');
const terminal=document.getElementById('terminal');
function updateCPU(){
  const val=Math.floor(Math.random()*100);
  cpuBar.style.width=val+'%';
  cpuCircle.style.background=`conic-gradient(${val}% var(--accent-green), transparent ${val}% 100%)`;
}
setInterval(updateCPU,800);
function addLog(){
  const lines=[
    "0x00FF Bypass Security",
    "Initializing Matrix...",
    "Connection Established",
    "Loading Core Modules",
    "CPU Load: 42%",
    "RAM Usage: 73%",
    "Firewall: OFF",
    "Scanning for anomalies...",
    "Anomaly detected: 0xA7C3",
    "Redirecting traffic...",
    "System Stabilized"
  ];
  const line=document.createElement('div');
  line.textContent=lines[Math.floor(Math.random()*lines.length)];
  terminal.appendChild(line);
  terminal.scrollTop=terminal.scrollHeight;
}
setInterval(addLog,500);
</script>
</body>
</html>
