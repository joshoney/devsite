<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe</title>
<style>
  body {
    margin: 0;
    background: #121212;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 {
    margin-bottom: 20px;
    font-size: 2rem;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 5px;
  }
  .cell {
    width: 100px;
    height: 100px;
    background: #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }
  .cell:hover:not(.disabled) {
    background: #2a2a2a;
    transform: scale(1.05);
  }
  .cell.disabled {
    cursor: default;
  }
  .message {
    margin: 20px 0;
    font-size: 1.5rem;
    min-height: 1.5em;
  }
  .restart {
    padding: 10px 20px;
    background: #3a3a3a;
    border: none;
    color: #e0e0e0;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s;
  }
  .restart:hover {
    background: #4a4a4a;
  }
</style>
</head>
<body>
<h1>Tic Tac Toe</h1>
<div class="board" id="board">
  <div class="cell" data-index="0"></div>
  <div class="cell" data-index="1"></div>
  <div class="cell" data-index="2"></div>
  <div class="cell" data-index="3"></div>
  <div class="cell" data-index="4"></div>
  <div class="cell" data-index="5"></div>
  <div class="cell" data-index="6"></div>
  <div class="cell" data-index="7"></div>
  <div class="cell" data-index="8"></div>
</div>
<div class="message" id="message"></div>
<button class="restart" id="restart">Restart Game</button>
<script>
  const boardEl = document.getElementById('board');
  const messageEl = document.getElementById('message');
  const restartBtn = document.getElementById('restart');
  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameActive = true;

  const winCombos = [
    [0,1,2],[3,4,5],[6,7,8], // rows
    [0,3,6],[1,4,7],[2,5,8], // columns
    [0,4,8],[2,4,6]          // diagonals
  ];

  function handleCellClick(e) {
    const cell = e.target;
    const idx = parseInt(cell.dataset.index);
    if (!gameActive || board[idx]) return;
    board[idx] = currentPlayer;
    cell.textContent = currentPlayer;
    cell.classList.add('disabled');
    if (checkWin()) {
      messageEl.textContent = currentPlayer + ' wins!';
      gameActive = false;
    } else if (board.every(v => v)) {
      messageEl.textContent = 'It\'s a tie!';
      gameActive = false;
    } else {
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    }
  }

  function checkWin() {
    return winCombos.some(combo => {
      const [a,b,c] = combo;
      return board[a] && board[a] === board[b] && board[a] === board[c];
    });
  }

  function restartGame() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameActive = true;
    messageEl.textContent = '';
    document.querySelectorAll('.cell').forEach(cell => {
      cell.textContent = '';
      cell.classList.remove('disabled');
    });
  }

  boardEl.addEventListener('click', handleCellClick);
  restartBtn.addEventListener('click', restartGame);
</script>
</body>
</html>
